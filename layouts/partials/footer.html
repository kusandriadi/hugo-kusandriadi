    {{ end }}
    <script>
        document.getElementById('main-nav-toggle').addEventListener('click', function () {
            var header = document.getElementById('header');
            if (header.classList.contains('mobile-on')) {
                header.classList.remove('mobile-on');
            } else {
                header.classList.add('mobile-on');
            }
        });

        (function () {
            var parents = Array.prototype.slice.call(document.querySelectorAll('.nav-has-children'));
            parents.forEach(function (parent) {
                parent.addEventListener('click', function (e) {
                    if (e.target.closest('.nav-dropdown')) return;
                    e.preventDefault();
                    e.stopPropagation();
                    parents.forEach(function (other) {
                        if (other !== parent) other.classList.remove('is-open');
                    });
                    parent.classList.toggle('is-open');
                });
            });
            document.addEventListener('click', function (e) {
                if (!e.target.closest('.nav-has-children')) {
                    parents.forEach(function (p) { p.classList.remove('is-open'); });
                }
            });
        })();
    </script>
</footer>
