name: Deploy Hugo to kusandriadi.github.io

on:
  push:
    branches:
      - master
      - main
  schedule:
    - cron: '15 */6 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.161.1'
          extended: true

      - name: Build site
        run: hugo --minify --gc

      - name: Preserve AGENTS.md from publish branch
        continue-on-error: true
        run: |
          curl -fsSL https://raw.githubusercontent.com/kusandriadi/kusandriadi.github.io/master/AGENTS.md -o ./public/AGENTS.md
          echo "AGENTS.md preserved into public/"

      - name: Deploy to kusandriadi.github.io
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
          external_repository: kusandriadi/kusandriadi.github.io
          publish_branch: master
          publish_dir: ./public
          cname: kusandriadi.com
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy from hugo-kusandriadi @ ${{ github.sha }}'
