baseURL = "https://kusandriadi.com/"
theme="hugo-theme-minos"
title = "Kus Andriadi"
enableRobotsTXT=true
googleAnalytics = "UA-141670233-1"

[taxonomies]
  tag = "tags"

[[menu.main]]
  name = "About"
  identifier = "about"
  url = "/about/"
  weight = 1

[params.author]
	name = "Kus Andriadi"
	github = "kusandriadi"

[params]
	showShareIcons=true
	canonifyurls = true
	enableEmoji=true

[permalinks]
  posts = "/:section/:title/"

[sitemap]
  ChangeFreq = "weekly"
  Priority = "0.5"
  filename = "sitemap.xml"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
